<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labo Darkroom</title>
<meta name="description" content="One look for the whole roll, a correction for every photo.">
<meta name="theme-color" content="#0d0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Labo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editor, not a web page. Desktop — the photo owns the screen, a filmstrip under it,
   one quiet panel on the right (Looks · Adjust · This photo). Phone — photo pinned on top,
   filmstrip, then the panel; Import and Save in a dock.
   Restraint is the point: near-black neutrals, hairlines, one type family with its mono,
   white for the primary action and selection, a single safelight-red dot as the brand. */
:root{
  --bg:#0d0d0e; --stage:#08080a; --surface:#121214; --surface-2:#1a1a1d; --surface-3:#232327;
  --hair:rgba(255,255,255,.07); --hair-2:rgba(255,255,255,.13);
  --fg:#f2f0ec; --muted:#8e8c91; --faint:#5d5c61;
  --red:#e5483a; --amber:#e3a04a; --green:#8fcf9c;
  --f:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --bar-h:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f);margin:0;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,label{font-family:inherit}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:var(--bar-h);display:flex;align-items:center;gap:18px;padding-inline:20px;background:rgba(13,13,14,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(229,72,58,.7);align-self:center}
.word{font:600 17px/1 var(--f);letter-spacing:-.03em;margin:0}
.kicker{font:500 10px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.roll input{background:transparent;border:1px solid transparent;border-radius:7px;color:var(--fg);font:500 13px var(--f);padding:6px 9px;width:220px;max-width:30vw}
.roll input:hover{border-color:var(--hair)}
.roll input:focus{border-color:var(--hair-2);background:var(--surface);outline:0}
.meta{font:400 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-left:auto;white-space:nowrap}
.actions{display:flex;gap:8px}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:var(--surface-3);color:var(--fg);font:500 13px/1 var(--f);letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:#2c2c31}
.btn.primary{background:var(--fg);color:#0d0d0e}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent;border-color:var(--hair-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{height:28px;padding:0 11px;font-size:12px;border-radius:7px}
.btn.wide{width:100%}
.btn[aria-pressed="true"]{background:var(--fg);color:#0d0d0e;border-color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* app */
.app{display:grid;grid-template-columns:minmax(0,1fr) 352px;height:calc(100dvh - var(--bar-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.viewer{display:grid;grid-template-rows:minmax(0,1fr) auto auto;background:var(--stage);min-width:0;min-height:0}
.stage{position:relative;overflow:hidden;min-width:0;display:flex;align-items:center;justify-content:center;padding:32px 40px 20px;min-height:0;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:pointer}
.stage canvas{display:block;max-width:100%;max-height:100%;box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04)}
.split{position:absolute;width:1px;background:rgba(255,255,255,.9);pointer-events:none;transform:translateX(-.5px)}
.split .knob{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(13,13,14,.75);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(6px)}
.split .knob::before,.split .knob::after{content:"";position:absolute;top:50%;width:0;height:0;border-block:4px solid transparent;margin-top:-4px}
.split .knob::before{left:7px;border-right:5px solid #fff}
.split .knob::after{right:7px;border-left:5px solid #fff}
.vtag{position:absolute;font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);padding:5px 7px;border-radius:5px;pointer-events:none}
.drop{position:absolute;inset:16px;border:1px dashed var(--hair-2);border-radius:14px;background:rgba(8,8,10,.85);display:flex;align-items:center;justify-content:center;font:500 15px var(--f);color:var(--fg);z-index:3}

.caption{display:flex;align-items:center;gap:14px;padding:10px 20px;border-top:1px solid var(--hair);min-width:0}
.frame-no{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--fg);flex:none}
.file{font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.notes{display:flex;gap:6px;overflow:hidden;flex:1 1 auto;min-width:0;justify-content:flex-end}
.note{display:inline-flex;align-items:center;gap:6px;font:400 12px/1 var(--f);color:#c9c7cc;background:var(--surface-2);border-radius:999px;padding:5px 10px;white-space:nowrap}
.note::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber)}
.note.ok::before{background:var(--green)}

.filmstrip{display:flex;gap:6px;overflow-x:auto;padding:12px 20px 16px;border-top:1px solid var(--hair);background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
.ft{appearance:none;flex:none;position:relative;padding:0;border:0;background:#000;border-radius:3px;overflow:hidden;cursor:pointer;opacity:.5;transition:opacity .15s,box-shadow .15s}
.ft:hover{opacity:.85}
.ft[aria-selected="true"]{opacity:1;box-shadow:0 0 0 1.5px var(--fg)}
.ft canvas{display:block;height:58px;width:auto}
.ft .no{position:absolute;left:5px;bottom:4px;font:500 9px/1 var(--f-mono);color:#fff;text-shadow:0 1px 3px #000;letter-spacing:.06em}
.ft.skip{opacity:.25}
.ft.skip::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red)}

/* panel */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--hair)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--hair);flex:none;padding-inline:8px}
.tab{appearance:none;background:none;border:0;border-bottom:1.5px solid transparent;color:var(--muted);font:500 13px var(--f);height:46px;cursor:pointer;transition:color .15s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.pane{flex:1;overflow:auto;padding:18px 18px 28px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
.pane h3{font:500 10.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:22px 0 12px}
.pane h3:first-child{margin-top:4px}
.pane section + section,.pane details,.pane details + section{border-top:1px solid var(--hair);margin-top:20px;padding-top:2px}
.intro{background:var(--surface-2);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-bottom:6px}
.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.intro strong{color:var(--fg);font-weight:500}
.lookdesc{margin:4px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5;min-height:3em}
.lookdesc strong{color:var(--fg);font-weight:500}
.look-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
.look{appearance:none;background:none;border:0;padding:0;color:var(--muted);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;font:400 12.5px/1.2 var(--f)}
.look canvas{display:block;width:100%;aspect-ratio:3/2;height:auto;border-radius:7px;background:#000;transition:box-shadow .15s,transform .15s}
.look:hover canvas{transform:translateY(-1px)}
.look:hover{color:var(--fg)}
.look[aria-pressed="true"]{color:var(--fg)}
.look[aria-pressed="true"] canvas{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--fg)}

.sl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin:4px 0 12px}
.sl label{font-size:13px;color:#d9d7db}
.sl output{font:400 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sl input{grid-column:1 / -1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:2px;background:var(--hair-2);border-radius:2px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin:8px 0 0}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary h3{margin:22px 0 12px}
details summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:-4px}
details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.gearname{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
details > .btn{margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted)}
.field input{background:var(--bg);border:1px solid var(--hair-2);color:var(--fg);font:14px var(--f);padding:8px 10px;border-radius:8px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;background:var(--bg);border:1px solid var(--hair);border-radius:9px;margin-bottom:14px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12.5px var(--f);height:30px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sync{display:block;margin-top:14px;font:400 10.5px var(--f-mono);letter-spacing:.04em;color:var(--faint)}
.found{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.found li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13px}
.found li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.found li.ok::before{background:var(--green)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;margin-top:6px}
.switch input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{transform:translateX(14px)}

/* dock + toast */
.dock{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:30;width:min(380px,calc(100% - 32px));background:rgba(26,26,29,.92);backdrop-filter:blur(14px);border:1px solid var(--hair-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.toast p{margin:0;font-size:13px}
.prog{height:2px;background:var(--hair-2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}

@media (max-width:900px){
  :root{--bar-h:52px}
  .bar{gap:12px;padding-inline:16px}
  .roll,.actions{display:none}
  .app{display:block;height:auto}
  .viewer{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:5;grid-template-rows:auto auto auto;border-bottom:1px solid var(--hair)}
  .stage{height:40vh;padding:12px 16px 8px}
  .caption{padding:8px 16px;gap:10px}
  .notes{display:none}
  .caption .btn{margin-left:auto}
  .filmstrip{padding:8px 16px 10px;gap:5px}
  .ft canvas{height:42px}
  .panel{border-left:0;min-height:auto}
  .tabs{position:static;padding-inline:4px}
  .pane{overflow:visible;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .look-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
  .dock{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(13,13,14,.9);backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
  .dock .btn{height:44px;font-size:14px;border-radius:10px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#looks > h3:first-child{margin-top:20px}
</style>

<header class="bar">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <h1 class="word">Labo</h1>
    <span class="kicker" aria-hidden="true">Darkroom</span>
  </div>
  <label class="roll"><span class="sr">Roll name</span><input id="series" type="text" value="Roll" spellcheck="false"></label>
  <span class="meta" id="count"></span>
  <div class="actions">
    <label class="btn ghost" for="pick">Import</label>
    <button class="btn primary" id="saveTop" type="button">Save</button>
  </div>
</header>
<input id="pick" type="file" multiple hidden accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.cr2,.cr3,.nef,.arw,.raf,.dng,.orf,.rw2,.pef,.srw">

<div class="app">
  <section class="viewer" aria-label="Photo">
    <div class="stage" id="stage">
      <canvas id="vcan" aria-label="Current photo"></canvas>
      <div class="split" id="split" hidden><i class="knob" aria-hidden="true"></i></div>
      <span class="vtag" id="tagBefore" hidden>Before</span>
      <span class="vtag" id="tagAfter" hidden>After</span>
      <span class="vtag hold" id="tagHold" hidden>Original</span>
      <div class="drop" id="drop" hidden><span>Drop photos to import</span></div>
    </div>
    <div class="caption">
      <span class="frame-no" id="capNo"></span>
      <span class="file" id="capName"></span>
      <div class="notes" id="capNotes"></div>
      <button class="btn ghost small" id="compare" type="button" aria-pressed="false">Compare</button>
    </div>
    <div class="filmstrip" id="filmstrip" role="listbox" aria-label="Photos in this roll"></div>
  </section>

  <aside class="panel" aria-label="Controls">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="looks" aria-selected="true" type="button">Looks</button>
      <button class="tab" role="tab" data-tab="adjust" aria-selected="false" type="button">Adjust</button>
      <button class="tab" role="tab" data-tab="photo" aria-selected="false" type="button">This photo</button>
    </div>

    <div class="pane" data-pane="looks" role="tabpanel">
      <div class="intro" id="intro">
        <p><strong>One look for the whole roll.</strong> Each photo is corrected on its own first: exposure, colour cast, skin tone.</p>
        <label class="btn primary" for="pick">Import your roll</label>
      </div>
      <p class="lookdesc" id="lookDesc"></p>
      <div id="looks"></div>
    </div>

    <div class="pane" data-pane="adjust" role="tabpanel" hidden>
      <section>
        <h3>Look</h3>
        <div id="lookSliders"></div>
        <button id="saveLook" class="btn ghost small" type="button">Keep this look</button>
      </section>
      <section>
        <h3>Auto correction</h3>
        <div id="autoSliders"></div>
        <p class="hint">Applied to each photo before the look.</p>
      </section>
      <details id="gearBox">
        <summary><h3>My gear</h3><span class="gearname" id="gearName"></span></summary>
        <button id="mju" class="btn ghost small wide" type="button">Load Olympus mju II + Portra 400</button>
        <div class="field"><label for="gearInput">Camera / film</label><input id="gearInput" type="text" placeholder="e.g. Olympus mju II · Portra 400"></div>
        <div id="gearSliders"></div>
        <button id="learn" class="btn ghost small" type="button">Learn from this roll</button>
        <p class="hint" id="learnOut"></p>
      </details>
      <section>
        <h3>Export</h3>
        <div class="seg" id="modeSeg" role="group" aria-label="Format">
          <button type="button" data-mode="photos" aria-pressed="false">Separate photos</button>
          <button type="button" data-mode="zip" aria-pressed="false">One ZIP file</button>
        </div>
        <div class="row">
          <button id="export" class="btn primary" type="button">Save the roll</button>
          <button id="clear" class="btn ghost" type="button">New roll</button>
        </div>
        <span id="sync" class="sync"></span>
      </section>
    </div>

    <div class="pane" data-pane="photo" role="tabpanel" hidden>
      <section>
        <h3>Found in this photo</h3>
        <ul class="found" id="found"></ul>
      </section>
      <section>
        <h3>Fine-tune</h3>
        <div id="nudgeSliders"></div>
        <label class="switch"><input type="checkbox" id="vskip"><span>Skip when saving</span></label>
      </section>
    </div>
  </aside>
</div>

<nav class="dock" aria-label="Actions">
  <label class="btn ghost" for="pick">Import</label>
  <button id="saveDock" class="btn primary" type="button">Save</button>
</nav>

<div class="toast" id="toast" role="status" hidden>
  <p id="toastMsg"></p>
  <div class="prog" id="prog" hidden><i></i></div>
  <div class="row" id="toastActs" hidden><button id="resume" class="btn small primary" type="button">Continue</button></div>
</div>

<script src="jszip.min.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- colour maths ---------- */
const S2L = new Float32Array(256);
for (let i = 0; i < 256; i++) { const v = i / 255; S2L[i] = v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
const l2s = x => { x = clamp(x, 0, 1); return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; };
function hash(x, y) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}

/* ---------- looks ---------- */
const Z = [0, 0, 0];
const PRESETS = [
  { id: "naturel", name: "Natural", contrast: .1, sat: .05, warm: 0, fade: 0, grain: 0, vign: .1, tint: 0, shadows: 0, highlights: 0, ss: Z, sh: Z, bw: false },
  // Kodak Portra 400: soft contrast, long highlight roll-off, peach skin, slightly cyan-green shadows, fine grain (scans already carry real grain)
  { id: "portra400", name: "Portra 400", desc: "The Portra rendering: soft contrast, peachy skin, highlights that never burn out.", contrast: -.08, sat: -.06, warm: .22, fade: .18, grain: .12, vign: 0, tint: -.04, shadows: .12, highlights: -.28, ss: [-.08, .03, .07], sh: [.14, .07, -.06], bw: false },

    else p.mid = p.thumb;
  }
  if (cur() === p) { renderStage(); paintLooks(); }
}
function renderStage(src) {
  const p = cur(); if (!p) return; src = src || p.mid || p.thumb;
  const c = $("vcan"); if (c.width !== src.width || c.height !== src.height) { c.width = src.width; c.height = src.height; }
  const x = c.getContext("2d");
  if (holding) { x.putImageData(src, 0, 0); }
  else {
    x.putImageData(render(src, buildParams(p), { cell: Math.max(1, Math.round(src.width / 1600)), sharpen: src === p.mid }), 0, 0);
    if (comparing) x.putImageData(src, 0, 0, 0, 0, Math.round(c.width * split), c.height);
  }
  placeOverlay();
}
function fitCanvas() {
  // scale the photo to fill the stage (up or down), keeping its proportions
  const c = $("vcan"), st = $("stage"), cs = getComputedStyle(st);
  const w = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (!c.width || w <= 0 || h <= 0) return;
  const k = Math.min(w / c.width, h / c.height);
  c.style.width = Math.floor(c.width * k) + "px"; c.style.height = Math.floor(c.height * k) + "px";
}
function placeOverlay() {
  fitCanvas();
  const r = $("vcan").getBoundingClientRect(), st = $("stage").getBoundingClientRect();
  const left = r.left - st.left, top = r.top - st.top;
  const s = $("split"); s.hidden = !comparing || holding;
  Object.assign(s.style, { left: (left + r.width * split) + "px", top: top + "px", height: r.height + "px" });
  const tb = $("tagBefore"), ta = $("tagAfter"), th = $("tagHold");
  tb.hidden = !comparing || holding || split < .14; ta.hidden = !comparing || holding || split > .86; th.hidden = !holding;
  const y = (top + 12) + "px";
  Object.assign(tb.style, { top: y, left: (left + 12) + "px" });
  Object.assign(ta.style, { top: y, left: (left + r.width - 12 - ta.offsetWidth) + "px" });
  Object.assign(th.style, { top: y, left: (left + 12) + "px" });
}
function paintCaption() {
  const p = cur(); if (!p) return;
  $("capNo").textContent = `${String(state.viewIdx + 1).padStart(2, "0")} / ${String(state.photos.length).padStart(2, "0")}`;
  $("capName").textContent = p.name;
  $("capNotes").replaceChildren(...p.auto.notes.slice(0, 3).map(([t, k]) => { const s = document.createElement("span"); s.className = "note " + k; s.textContent = t; return s; }));
}
function paintFound() {
  const p = cur(); if (!p) return;
  $("found").replaceChildren(...p.auto.notes.map(([t, k]) => { const li = document.createElement("li"); li.className = k; li.textContent = t; return li; }));
}
(() => {
  const st = $("stage"), c = $("vcan"); let down = false, x0 = 0, t0 = 0, moved = false, pending = 0;
  const setSplit = e => { const r = c.getBoundingClientRect(); split = clamp((e.clientX - r.left) / r.width, 0, 1); cancelAnimationFrame(pending); pending = requestAnimationFrame(() => renderStage()); };
  st.addEventListener("pointerdown", e => {
    if (e.target.closest(".drop")) return;
    down = true; moved = false; x0 = e.clientX; t0 = performance.now(); st.setPointerCapture(e.pointerId);
    if (comparing) setSplit(e); else { holding = true; renderStage(); }
  });
  st.addEventListener("pointermove", e => { if (!down) return; if (Math.abs(e.clientX - x0) > 6) moved = true; if (comparing) setSplit(e); });
  const up = e => {
    if (!down) return; down = false;
    if (holding) { holding = false; renderStage(); }
    const dx = e.clientX - x0;
    if (!comparing && e.pointerType === "touch" && performance.now() - t0 < 300 && Math.abs(dx) > 50) select(state.viewIdx + (dx < 0 ? 1 : -1));
  };
  st.addEventListener("pointerup", up); st.addEventListener("pointercancel", up);
  addEventListener("resize", placeOverlay);
})();
$("compare").addEventListener("click", e => { comparing = !comparing; e.currentTarget.setAttribute("aria-pressed", String(comparing)); renderStage(); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight") select(state.viewIdx + 1);
  if (e.key === "ArrowLeft") select(state.viewIdx - 1);
  if (e.key === "\\" || e.key === "c") $("compare").click();
});

/* ---------- sliders ---------- */
function slider(parent, id, label, min, max, get, set, step = .01, fmt = v => (v > 0 ? "+" : "") + Math.round(v * 100)) {
  const row = document.createElement("div"); row.className = "sl";
  const lb = document.createElement("label"); lb.htmlFor = id; lb.textContent = label;
  const out = document.createElement("output"); out.htmlFor = id; out.textContent = fmt(get());
  const r = document.createElement("input"); r.type = "range"; r.id = id; r.min = min; r.max = max; r.step = step; r.value = get();
  r.addEventListener("input", () => { set(+r.value); out.textContent = fmt(+r.value); });
  row.append(lb, out, r); parent.append(row);
  return { sync() { r.value = get(); out.textContent = fmt(get()); } };
}
const lookCtl = []; let gearCtl = [], nudgeCtl = [], strengthCtl;
function buildControls() {
  LOOK_SLIDERS.forEach(([k, label, mn, mx]) => lookCtl.push(slider($("lookSliders"), "look-" + k, label, mn, mx, () => state.look[k], v => { state.look[k] = v; state.lookId = null; markLooks(); changed(); })));
  strengthCtl = slider($("autoSliders"), "strength", "Strength", 0, 1, () => state.strength, v => { state.strength = v; changed(); }, .01, v => Math.round(v * 100) + "%");
  const gs = $("gearSliders"), ev1 = v => (v > 0 ? "+" : "") + v.toFixed(1);
  gearCtl = [
    slider(gs, "g-ev", "Base exposure", -1, 1, () => state.gear.ev, v => { state.gear.ev = v; changed(); }, .1, ev1),
    slider(gs, "g-warm", "Base colour", -1, 1, () => state.gear.warm, v => { state.gear.warm = v; changed(); }),
    slider(gs, "g-lens", "Dark corners", 0, 1, () => state.gear.lens, v => { state.gear.lens = v; changed(); }),
    slider(gs, "g-sharp", "Sharpness", 0, 1, () => state.gear.sharpen, v => { state.gear.sharpen = v; changed(); }),
  ];
  $("gearInput").addEventListener("input", e => { state.gear.name = e.target.value; paintGearName(); persist(); });
  const nz = $("nudgeSliders");
  nudgeCtl = [
    slider(nz, "n-ev", "Exposure", -2, 2, () => cur()?.nudge.ev ?? 0, v => { cur().nudge.ev = v; changed(true); }, .1, ev1),
    slider(nz, "n-warm", "Warmth", -1, 1, () => cur()?.nudge.warm ?? 0, v => { cur().nudge.warm = v; changed(true); }),
  ];
}
function paintGearName() { $("gearName").textContent = state.gear.name || ""; }
function paintMode() { $("modeSeg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === state.exportMode))); }
function syncControls() {
  lookCtl.forEach(c => c.sync()); gearCtl.forEach(c => c.sync()); strengthCtl.sync();
  $("gearInput").value = state.gear.name; paintGearName(); paintMode();
}
let rerenderTimer = 0;
function changed(photoOnly) {
  cancelAnimationFrame(rerenderTimer);
  rerenderTimer = requestAnimationFrame(() => {
    renderStage();
    if (photoOnly) paintThumb(cur());
    else { scheduleFilm(); clearTimeout(changed.t); changed.t = setTimeout(paintLooks, 120); }
  });
  if (!photoOnly) persist();
}
$("vskip").onchange = e => { cur().skip = e.target.checked; markFilm(); paintCounts(); };

/* ---------- roll ---------- */
function paintCounts() {
  const n = real().length, k = saveable().length;
  $("count").textContent = n ? `${n} frame${n > 1 ? "s" : ""}` : "Samples";
  ["saveTop", "saveDock"].forEach(id => $(id).textContent = k ? `Save ${k}` : "Save");
  $("intro").hidden = n > 0; $("clear").hidden = n === 0;
}
function loadRoll() { buildFilm(); paintCounts(); select(clamp(state.viewIdx, 0, state.photos.length - 1)); }

async function addFiles(files) {
  files = [...files]; if (!files.length) return;
  if (state.photos.some(p => p.sample)) state.photos = [];
  const start = state.photos.length; let ok = 0; const bad = [];
  for (const [i, f] of files.entries()) {
    toast(`Analysing ${i + 1} / ${files.length}`, { progress: i / files.length, stay: true });
    try {
      const bm = await decode(f); const thumb = toImageData(bm, 480); bm.close();
      state.photos.push(makePhoto({ name: f.name, file: f, thumb, id: f.name + f.size + i }));
      ok++;
    } catch (e) { bad.push(f.name); }
  }
  if (!$("series").dataset.touched) {
    const d = files[0].lastModified ? new Date(files[0].lastModified) : new Date();
    $("series").value = "Roll " + d.toLocaleDateString("en-GB");
  }
  toast(`${ok} photo${ok > 1 ? "s" : ""} ready.` + (bad.length ? ` Could not read: ${bad.join(", ")}.` : ""));
  state.viewIdx = start; loadRoll(); setTab("looks");
}
$("pick").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("series").addEventListener("input", e => e.target.dataset.touched = "1");
document.addEventListener("dragover", e => { e.preventDefault(); $("drop").hidden = false; });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("drop").hidden = true; });
document.addEventListener("drop", e => { e.preventDefault(); $("drop").hidden = true; addFiles(e.dataTransfer.files); });
let clearArmed = 0;
$("clear").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!clearArmed) { b.textContent = "Clear the roll?"; clearArmed = setTimeout(() => { b.textContent = "New roll"; clearArmed = 0; }, 3000); return; }
  clearTimeout(clearArmed); clearArmed = 0; b.textContent = "New roll";
  loadSamples(); state.viewIdx = 0; $("series").dataset.touched = ""; $("series").value = "Roll"; loadRoll(); toast("Roll cleared.");
});

/* ---------- gear & looks ---------- */
$("mju").addEventListener("click", () => {
  state.gear = { ...MJU };
  state.look = JSON.parse(JSON.stringify(PRESETS.find(p => p.id === "portra400"))); state.lookId = "portra400"; state.strength = .8;
  syncControls(); markLooks(); changed(); toast("Olympus mju II + Portra 400 loaded.");
});
$("learn").addEventListener("click", () => {
  const set = real().length ? real() : state.photos;
  const ev = set.reduce((a, p) => a + p.auto.ev, 0) / set.length;
  const warmth = set.reduce((a, p) => a + (p.auto.wb[0] - p.auto.wb[2]), 0) / set.length;
  const parts = [];
  if (Math.abs(ev) >= .2) parts.push(ev > 0 ? `comes out about ${ev.toFixed(1)} EV dark` : `comes out about ${(-ev).toFixed(1)} EV bright`);
  if (Math.abs(warmth) >= .05) parts.push(warmth > 0 ? "leans blue" : "leans yellow");
  $("learnOut").textContent = parts.length
    ? `Across ${set.length} photos, your gear ${parts.join(" and ")}. Auto correction already compensates photo by photo; the settings above are for your taste.`
    : `Across ${set.length} photos, your gear is neutral: nothing to compensate.`;
});
$("saveLook").addEventListener("click", () => {
  const n = state.savedLooks.length + 1, id = "mine-" + Date.now();
  state.savedLooks.push({ ...JSON.parse(JSON.stringify(state.look)), art: false, id, name: "My look " + n, desc: "Your saved look." });
  state.lookId = id; buildLooks(); persist(); toast(`“My look ${n}” added to Looks.`);
});
$("modeSeg").addEventListener("click", e => { const m = e.target.closest("button")?.dataset.mode; if (m) { state.exportMode = m; paintMode(); persist(); } });

/* ---------- save ---------- */
async function saveBlob(name, blob) {
  const dl = await dlP;
  if (dl) return dl.save({ filename: name, data: blob });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function develop(p) {
  const bm = await decode(p.file); const src = toImageData(bm); bm.close();
  const out = render(src, buildParams(p), { cell: Math.max(1, Math.round(src.width / 1600)), sharpen: true });
  const c = document.createElement("canvas"); c.width = out.width; c.height = out.height; c.getContext("2d").putImageData(out, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .92));
  return new File([blob], p.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
}
let busy = false, queue = null;
async function exportSeries() {
  if (busy) return;
  const list = saveable();
  if (!list.length) { toast("Import your photos first: the samples are not saved."); return; }
  busy = true;
  try {
    const files = [];
    for (const [i, p] of list.entries()) {
      toast(`Developing ${i + 1} / ${list.length}`, { progress: i / list.length, stay: true });
      await new Promise(r => setTimeout(r, 20));
      files.push(await develop(p));
    }
    if (state.exportMode === "zip") {
      toast("Packing the ZIP…", { progress: 1, stay: true });
      const zip = new JSZip(); files.forEach(f => zip.file(f.name, f));
      const base = ($("series").value.trim() || "Roll").replace(/[\\/:*?"<>|]+/g, "-");
      await saveBlob(base + ".zip", await zip.generateAsync({ type: "blob" }));
      toast(`${base}.zip saved · ${files.length} photos.`);
      return;
    }
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); toast(`${files.length} photos sent to your gallery.`); return; }
      catch (e) { if (e.name === "AbortError") { toast("Sharing cancelled."); return; } }
    }
    queue = { files, i: 0 };
    await drainQueue();
  } catch (e) {
    toast("Saving failed: " + (e.message || e.code || e));
  } finally { busy = false; }
}
async function drainQueue() {
  const q = queue; if (!q) return;
  while (q.i < q.files.length) {
    const f = q.files[q.i];
    toast(`Photo ${q.i + 1} / ${q.files.length}`, { progress: q.i / q.files.length, stay: true });
    try { await saveBlob(f.name, f); q.i++; }
    catch (e) {
      if (e && e.code === "rate_limited") { await new Promise(r => setTimeout(r, 1200)); continue; }
      toast(`Stopped at ${q.i} / ${q.files.length}.`, { progress: q.i / q.files.length, resume: true });
      return;
    }
  }
  toast(`${q.files.length} photo${q.files.length > 1 ? "s" : ""} saved.`, { progress: 1 });
  queue = null;
}
$("resume").addEventListener("click", () => { $("toastActs").hidden = true; drainQueue(); });
["export", "saveTop", "saveDock"].forEach(id => $(id).addEventListener("click", exportSeries));

/* ---------- settings: your account, else this device ---------- */
let docRef = null, saveTimer = 0;
const KEY = "labo-serie-v1";
function snapshot() { return { gear: state.gear, savedLooks: state.savedLooks, look: state.look, lookId: state.lookId, strength: state.strength, exportMode: state.exportMode }; }
function apply(s) {
  if (!s) return;
  if (s.gear) state.gear = { ...state.gear, ...s.gear };
  if (Array.isArray(s.savedLooks)) state.savedLooks = s.savedLooks;
  if (s.look) { state.look = { ...state.look, ...s.look }; state.lookId = s.lookId ?? null; }
  if (typeof s.strength === "number") state.strength = s.strength;
  if (!isPhone && (s.exportMode === "zip" || s.exportMode === "photos")) state.exportMode = s.exportMode;
}
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const s = JSON.parse(JSON.stringify(snapshot()));
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    if (docRef) { try { await docRef.set(s); $("sync").textContent = "Settings synced to your account"; } catch (e) { $("sync").textContent = "Settings kept on this device"; } }
  }, 900);
}
try { apply(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) {}
$("sync").textContent = "Settings kept on this device";

/* ---------- boot ---------- */
buildControls(); syncControls(); loadSamples(); buildLooks(); loadRoll();

(async () => {
  try {
    if (!window.claude?.use) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const uid = await u.id(); if (!uid) return;
    docRef = d.doc("data/users/" + uid + "/labo");
    const snap = await docRef.get();
    if (snap.exists) { apply(snap.data()); syncControls(); buildLooks(); changed(); }
    $("sync").textContent = "Settings synced to your account";
  } catch (e) { /* stays on this device */ }
})();
})();
</script>
